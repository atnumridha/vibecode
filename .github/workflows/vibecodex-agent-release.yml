name: Vibe Codex Agent Release

on:
  push:
    tags:
      - 'vibecodex-agent-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update. Defaults to vibecodex-agent-v<package version>.'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease.'
        required: false
        default: false
        type: boolean
      publish_marketplaces:
        description: 'Publish to VS Marketplace/Open VSX when matching secrets are configured.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vibecodex-agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build VSIX and publish release
    runs-on: ubuntu-latest
    env:
      EXT_DIR: extensions/vibecodex-agent
      INPUT_TAG: ${{ inputs.tag || '' }}
      INPUT_PRERELEASE: ${{ inputs.prerelease || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extensions/vibecodex-agent/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix "$EXT_DIR"

      - name: Verify and package extension
        run: npm --prefix "$EXT_DIR" run verify

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./${EXT_DIR}/package.json').version")"
          publisher="$(node -p "require('./${EXT_DIR}/package.json').publisher")"
          name="$(node -p "require('./${EXT_DIR}/package.json').name")"
          vsix_path="${EXT_DIR}/${publisher}.${name}-${version}.vsix"
          checksum_path="${vsix_path}.sha256"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            release_tag="${INPUT_TAG}"
          else
            release_tag="vibecodex-agent-v${version}"
          fi

          prerelease="${INPUT_PRERELEASE}"
          if [[ "${version}" == *"-"* ]]; then
            prerelease="true"
          fi

          if [[ ! -f "${vsix_path}" || ! -f "${checksum_path}" ]]; then
            echo "Expected package artifacts were not created." >&2
            ls -la "${EXT_DIR}" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "release_tag=${release_tag}"
            echo "vsix_path=${vsix_path}"
            echo "checksum_path=${checksum_path}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify VSIX checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXT_DIR"
          sha256sum -c "$(basename "${{ steps.meta.outputs.checksum_path }}")"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibecodex-agent-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.meta.outputs.vsix_path }}
            ${{ steps.meta.outputs.checksum_path }}

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          checksum="$(cut -d' ' -f1 "${{ steps.meta.outputs.checksum_path }}")"
          {
            echo "## Vibe Codex Agent ${{ steps.meta.outputs.version }}"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- VSIX: \`$(basename "${{ steps.meta.outputs.vsix_path }}")\`"
            echo "- SHA256: \`${checksum}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_TITLE: Vibe Codex Agent ${{ steps.meta.outputs.version }}
          VSIX_PATH: ${{ steps.meta.outputs.vsix_path }}
          CHECKSUM_PATH: ${{ steps.meta.outputs.checksum_path }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          prerelease_args=()
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${VSIX_PATH}" "${CHECKSUM_PATH}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "${RELEASE_TAG}" "${VSIX_PATH}" "${CHECKSUM_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi

      - name: Publish marketplace packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_marketplaces == true }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_PATH: ${{ steps.meta.outputs.vsix_path }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${VSCE_PAT:-}" ]]; then
            npx --yes @vscode/vsce@3.6.1 publish --packagePath "${VSIX_PATH}" --pat "${VSCE_PAT}"
          else
            echo "VSCE_PAT is not configured; skipping VS Marketplace publish."
          fi

          if [[ -n "${OVSX_PAT:-}" ]]; then
            npx --yes ovsx publish "${VSIX_PATH}" -p "${OVSX_PAT}"
          else
            echo "OVSX_PAT is not configured; skipping Open VSX publish."
          fi
